<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>商品简称表 · 早日发财有限公司</title>
<meta name="theme-color" content="#faf6f2" />
<link rel="icon" href="favicon.svg" />
<link rel="stylesheet" href="app.css" />
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="logo">🧾</div>
      <div>
        <div class="title">商品简称表</div>
        <div class="sub">点简称直接复制，贴进群里就行</div>
      </div>
    </div>
    <nav class="tabs">
      <a href="index.html">开单</a>
      <a href="products.html" class="active">商品表</a>
      <a href="rules.html">规则</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <input type="search" id="q" placeholder="搜简称或色号：401 / 羊绒 / 琉璃 / 雪宝绒" />
    <div class="filters" style="margin-top:10px">
      <button class="chip on" data-filter="all" type="button">全部</button>
      <button class="chip" data-filter="in" type="button">还有货</button>
      <button class="chip" data-filter="out" type="button">已售罄</button>
    </div>
    <div class="note">库存快照：2026-11-12，实际以老板报的为准。</div>
  </section>

  <div id="list"></div>

  <div class="footer">
    <a href="index.html">← 回到下单生成器</a>
  </div>
</main>

<div class="bottombar">
  <a class="btn primary big" href="index.html">去开单</a>
</div>

<script src="common.js"></script>
<script src="products.js"></script>
<script>
(function () {
  const { copyText, toast, esc } = window.XD;
  const listEl = document.getElementById("list");
  const qEl = document.getElementById("q");
  let filter = "all";

  function stockText(it) {
    if (it.stock === null || it.stock === undefined) return "";
    if (it.stock < 0) return '<span class="badge over">超卖待核实</span>';
    if (it.stock === 0) return '<span class="badge out">已售罄</span>';
    return '<span class="badge ok">剩 ' + it.stock + " 团</span>";
  }

  function render() {
    const kw = qEl.value.trim().toLowerCase();
    let html = "";
    let total = 0;

    window.PRODUCTS.forEach((g) => {
      const hits = g.items.filter((it) => {
        if (filter === "in" && !(it.stock > 0)) return false;
        if (filter === "out" && !(it.stock <= 0)) return false;
        if (!kw) return true;
        return (
          it.short.toLowerCase().includes(kw) ||
          it.full.toLowerCase().includes(kw) ||
          g.series.toLowerCase().includes(kw)
        );
      });
      if (!hits.length) return;
      total += hits.length;
      html += '<div class="prod-group"><h2 style="font-size:14px;color:#8d7f78;margin:4px 0 8px">' +
        esc(g.series) + ' <span style="font-weight:400;font-size:12px">' + esc(g.hint || "") + "</span></h2>";
      hits.forEach((it) => {
        html +=
          '<div class="prod-item"><span class="pi-main"><b>' +
          esc(it.short) +
          "</b><small>" +
          esc(it.full) +
          (it.set ? " · 按套卖" : "") +
          '</small></span><span class="right">' +
          stockText(it) +
          '<button class="copy-mini" data-copy="' + esc(it.short) + '" type="button">复制</button></span></div>';
      });
      html += "</div>";
    });

    if (!total) html = '<div class="empty">没找到这个商品<br />（没有的告诉老板，加进商品资料）</div>';
    listEl.innerHTML = html;

    listEl.querySelectorAll("[data-copy]").forEach((b) =>
      b.addEventListener("click", async () => {
        const ok = await copyText(b.dataset.copy);
        toast(ok ? "已复制「" + b.dataset.copy + "」" : "复制失败，长按文字复制");
      })
    );
  }

  qEl.addEventListener("input", render);
  document.querySelectorAll("[data-filter]").forEach((b) =>
    b.addEventListener("click", () => {
      filter = b.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach((x) => x.classList.toggle("on", x === b));
      render();
    })
  );

  render();
})();
</script>
</body>
</html>
